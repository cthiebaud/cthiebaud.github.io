<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="canonical" href="https://cthiebaud.com" />

  <!-- Open Graph data -->
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="Christophe Thiebaud" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://cthiebaud.com" />
  <meta property="og:description" content="C'est le site de Christophe Thiebaud" />
  <meta property="og:site_name" content="cthiebaud.com" />

  <meta property="og:image" content="https://cthiebaud.com/cthiebaud.png" />
  <meta property="og:image:url" content="https://cthiebaud.com/cthiebaud.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- https://realfavicongenerator.net/svg-favicon/ -->
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
  <link rel="icon" type="image/png" href="/favicon/favicon.png">

  <title>Christophe Thiebaud</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@latest/dist/css/bootstrap.min.css">

  <style>
    body {
      background-color: #212529;
      color: ghostwhite
    }

    a {
      color: #cff4fc;
      text-decoration: none;
    }

    td>*,
    th>* {
      margin: 0 3px;
    }

    td:first-child,
    td:nth-child(2) {
      text-align: right !important;
    }

    .navbar img {
      border-radius: 50%;
      width: 100px;
      height: 100px;
      object-fit: cover;
      background-color: #101113a0;
    }

    .navbar img:not(:last-child) {
      margin-right: var(--margin-right)
    }

    td>*>img {
      width: 18px;
      height: auto;
    }

    .copyButton {
      background-color: transparent;
      border: none;
      margin: 0;
      padding: 0;
    }

    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    th.sortable {
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th.sortable:hover {
      color: #cff4fc;
    }

    th.sortable .sort-arrow {
      display: inline-block;
      width: 1em;
      opacity: 0.4;
    }

    th.sortable.sort-active .sort-arrow {
      opacity: 1;
    }

    tfoot tr:last-child td {
      border-bottom: none;
    }

  </style>

</head>

<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark static-top">
    <div class="container-lg">
      <div id="imgContainer" class="d-flex justify-content-around w-100" style="overflow: hidden;">
        <img title="c'est le petit garçon" src="/moi/petit_cropped_square.jpg">
        <img title="c'est l'étudiant" src="/moi/student_cropped.jpg">
        <img title="c'est en ce moment" src="/moi/marriage_matilde_cropped.jpg">
        <img title="c'est bientôt" src="/moi/8c9426e8ff0fc7a0a7cd18d6b3c865d4.png">
      </div>
    </div>
  </nav>
  <main class="container-lg table-responsive">
    <table class="table table-sm table-dark table-hover">
      <thead>
        <tr>
          <th class="text-center sortable" data-sort="domain">Domain</th>
          <th class="text-center sortable" data-sort="domain">Subdomain</th>
          <th class="text-center sortable" data-sort="local">Local</th>
          <th class="text-center sortable" data-sort="activity" title="Mean date across every commit in the repo's full history &#10;(equal weight per commit) &#8212; where the center of gravity of development sits, not just the latest touch">Peak Activity</th>
          <th class="text-center sortable" data-sort="lastCommit">Last Commit</th>
          <th class="text-end sortable" data-sort="commits" title="Rough estimate &#8212; full commit history, deduped by hash across branches/forks where a domain spans more than one repo">Commits</th>
          <th class="text-center">Links</th>
        </tr>
      </thead>
      <tbody id="domains">
      </tbody>
      <tfoot>
        <tr>
          <td class="text-secondary text-end" colspan="7">
            <span id="nginx-location">
              /usr/local/etc/nginx/nginx.conf
            </span>
            <a href="vscode://file/usr/local/etc/nginx/nginx.conf"><img src="/svgs/menu-svgrepo-com.svg"></a>
            <br />
            <span id="nginx-restart">
              brew services restart nginx
            </span>
            <button class="copyButton" data-clipboard-target="#nginx-restart"><img
                src="/svgs/copy-svgrepo-com.svg"></button>
            <br />
            <span id="stats-updated">
              stats last updated: 2026-10-14
            </span>
            <br />
          </td>
        </tr>
      </tfoot>
    </table>
  </main>
</body>

<script src="https://cdn.jsdelivr.net/npm/clipboard@latest/dist/clipboard.min.js"></script>
<script>
  var clipboard = new ClipboardJS('.copyButton');

  clipboard.on('success', function (e) {
    console.log('Text copied to clipboard:', e.text);
    alert('Text copied to clipboard: ' + e.text);
  });

  clipboard.on('error', function (e) {
    console.error('Failed to copy text:', e.action);
    alert('Failed to copy text. Please try again.');
  });
</script>

<script>
  "use strict"

  const ON_CTHIEBAUD_COM = window.location.hostname === 'cthiebaud.com'

  /* beautify ignore:start */
  const domains = {
    "cthiebaud.com": { gh: "cthiebaud/cthiebaud.github.io", local: 5050, activity: "2023-05-15", lastCommit: "2026-10-14", commits: 168 },
    "aequologica.cthiebaud.com": { gh: "aequologica/aequologica.github.io", local: 8081, activity: "2022-01-21", lastCommit: "2026-10-02", commits: 793 },
    "aletheia.cthiebaud.com": { gh: "cthiebaud/truth", local: 9090, apple: "https://apps.apple.com/us/app/aletheia-by-%C3%A6quologica/id6476017817", google: "https://play.google.com/store/apps/details?id=com.cthiebaud.aletheia.twa", activity: "2024-02-25", lastCommit: "2024-04-13", commits: 605 },
    "athenaeum.cthiebaud.com": { gh: "athenaeum-brew/making-of", local: 3004, noPublicSite: true, activity: "2024-07-26", lastCommit: "2024-12-04", commits: 185 },
    "bookshelves.cthiebaud.com": { gh: "cthiebaud/bookshelves", local: 2345, activity: "2023-11-11", lastCommit: "2024-02-23", commits: 452 },
    "bwv.cthiebaud.com": { gh: "orgs/musicollator/repositories", activity: "2025-06-12", lastCommit: "2026-01-07", commits: 508 },
    "ciaccona.cthiebaud.com": { gh: "musicollator/ciaccona", local: 1010, activity: "2023-07-10", lastCommit: "2025-02-24", commits: 514 },
    "covid.cthiebaud.com": { gh: "covid-aequologica-net/covid-aequologica-net.github.io", local: 3005, noPublicSite: true, activity: "2021-01-05", lastCommit: "2021-09-14", commits: 200 },
    "emugnier.cthiebaud.com": { gh: "cthiebaud/emugnier", local: 6060, activity: "2021-04-28", lastCommit: "2025-01-27", commits: 314 },
    "gear.cthiebaud.com": { gh: "cthiebaud/gear", local: 8082, activity: "2026-08-29", lastCommit: "2026-09-12", commits: 54 },
    "hat.cthiebaud.com": { noPublicSite: true, activity: "2018-05-23", lastCommit: "2021-03-09", commits: 1023 },
    "iroif.cthiebaud.com": { gh: "cthiebaud/iroif", local: 3003, noPublicSite: true, activity: "2016-11-23", lastCommit: "2026-10-14", commits: 18 },
    "klam.cthiebaud.com": { gh: "cthiebaud/klam", local: 7070, activity: "2021-09-22", lastCommit: "2021-11-09", commits: 41 },
    "mundial.cthiebaud.com": { gh: "born-in-plays-for/mundial", local: 4040, activity: "2026-06-28", lastCommit: "2026-07-27", commits: 1005 },
    "music.cthiebaud.com": { gh: "cthiebaud/music", local: 2020, activity: "2025-04-25", lastCommit: "2026-10-13", commits: 164 },
    "openmozart.cthiebaud.com": { gh: "cthiebaud/openmozart.net", local: 5001, activity: "2021-09-24", lastCommit: "2022-03-26", commits: 265 },
    "openricard.cthiebaud.com": { gh: "cthiebaud/openricard.net", activity: "2021-09-23", lastCommit: "2021-09-28", commits: 264 },
    "sangiosleague.cthiebaud.com": { gh: "sangiosleague/sangiosleague.github.io", local: 4001, noPublicSite: true, activity: "2021-08-11", lastCommit: "2021-09-22", commits: 242 },
    "sangiovannilipioni.cthiebaud.com": { gh: "sangiovannilipioni/sangiovannilipioni.github.io", local: 3001, noPublicSite: true, activity: "2021-09-06", lastCommit: "2022-04-29", commits: 135 },
  }
  /* beautify ignore:end */

  // utility functions
  function isArray(obj) {
    if (!obj) return false
    return obj.constructor === Array
  }

  function isValidString(candidate) {
    if (!candidate) return false
    return (typeof candidate === 'string' || candidate instanceof String)
  }

  function url2svg(url) {
    if (!isValidString(url)) {
      return null
    }
    if (url.includes("github.com")) {
      return "/svgs/github.svg"
    } else if (url.includes("apple.com")) {
      return "/svgs/Apple_logo_grey.svg"
    } else if (url.includes("firebase.google.com/")) {
      return "/svgs/firebase-svgrepo-com.svg"
    } else if (url.includes("google.com")) {
      return "/svgs/android-svgrepo-com.svg"
    } else if (url.includes("azure.com")) {
      return "/svgs/Microsoft_Azure.svg"
    }
    return null
  }

  function generatehref(name, hrefGenerator) {
    if (isValidString(name) && name.includes("http")) {
      return name
    }
    if (hrefGenerator) {
      return hrefGenerator(name)
    }
    return null
  }

  function createTD(names, hrefGenerator, clazz) {
    let td = document.createElement('td')
    if (clazz) {
      td.classList.add(...clazz.split(' '))
    }
    if (!isArray(names)) {
      names = [names]
    }
    names.forEach(name => {
      if (!name) return
      const href = generatehref(name, hrefGenerator)
      let child = document.createElement('a')
      if (href) {
        child = document.createElement('a')
        child.setAttribute('href', href)
        child.setAttribute('target', `_blank`)
      } else {
        child = document.createElement('span')
      }
      const imgSrc = url2svg(href)
      if (imgSrc) {
        let img = document.createElement('img')
        img.setAttribute('src', imgSrc)
        img.setAttribute('style', "width:24px; height:auto;")
        child.appendChild(img)
      } else {
        child.textContent = name
      }
      td.appendChild(child)
    })
    return td
  }

  function createTR(index, domainName, value) {
    let tr = document.createElement('tr')
    tr.setAttribute('id', domainName)
    // tr.appendChild(createTD(index))
    const isRoot = domainName === "cthiebaud.com"
    const domainHrefGen = isRoot
      ? (ON_CTHIEBAUD_COM ? null : (n => `https://${n}`))
      : (value.noPublicSite ? null : (value.page ? n => `https://${n}/${value.page}` : n => `https://${n}`))
    tr.appendChild(createTD(isRoot ? domainName : null, domainHrefGen, "align-middle"))
    const tdSubdomain = createTD(isRoot ? null : domainName, domainHrefGen, "align-middle")
    if (!isRoot && tdSubdomain.firstChild) {
      tdSubdomain.firstChild.textContent = domainName.replace(/\.cthiebaud\.com$/, "")
    }
    tr.appendChild(tdSubdomain)
    const localHrefGen = value.page ? n => `http://localhost:${n}/${value.page}` : n => `http://localhost:${n}`
    tr.appendChild(createTD(value.local, (isRoot && !ON_CTHIEBAUD_COM) ? null : localHrefGen, "text-center tabular-nums fs-6 align-middle"))
    const tdActivity = createTD(value.activity ? value.activity.slice(0, 7) : value.activity, null, "text-center tabular-nums fs-6 align-middle")
    if (value.commits) {
      tdActivity.setAttribute('title', `mean of ${value.commits} commits`)
    }
    tr.appendChild(tdActivity)
    tr.appendChild(createTD(value.lastCommit, null, "text-center tabular-nums fs-6 align-middle"))
    tr.appendChild(createTD(value.commits ? value.commits.toLocaleString() : value.commits, null, "text-end tabular-nums fs-6 align-middle"))
    tr.appendChild(createTD([value.apple, value.google, value.azure, value.gh], n => `https://github.com/${n}`, "text-end align-middle"))
    return tr
  }

  const tbody = document.querySelector('#domains')
  let domainEntries = Object.entries(domains)
  const sortState = { key: 'domain', ascending: true }

  function sortValue(value, key) {
    if (key === 'domain') return value[0].replace(/\.?cthiebaud\.com$/, '')
    if (key === 'local') return value[1].local || 0
    if (key === 'activity') return value[1].activity || ''
    if (key === 'lastCommit') return value[1].lastCommit || ''
    if (key === 'commits') return value[1].commits || 0
    return ''
  }

  function renderRows() {
    let entries = domainEntries.slice()
    if (sortState.key) {
      entries.sort((a, b) => {
        const va = sortValue(a, sortState.key)
        const vb = sortValue(b, sortState.key)
        if (sortState.key === 'domain') {
          if (va === '' && vb !== '') return -1
          if (vb === '' && va !== '') return 1
        }
        if (va < vb) return sortState.ascending ? -1 : 1
        if (va > vb) return sortState.ascending ? 1 : -1
        return 0
      })
    }
    tbody.innerHTML = ''
    let i = 1
    for (const [domainName, value] of entries) {
      tbody.appendChild(createTR(i++, domainName, value))
    }
  }

  function updateSortArrows() {
    document.querySelectorAll('th.sortable').forEach(th => {
      th.classList.remove('sort-active')
      const existingArrow = th.querySelector('.sort-arrow')
      if (existingArrow) existingArrow.remove()
      const arrow = document.createElement('span')
      arrow.classList.add('sort-arrow')
      if (th.dataset.sort === sortState.key) {
        th.classList.add('sort-active')
        arrow.textContent = sortState.ascending ? '▲' : '▼'
      } else {
        arrow.textContent = '⇅'
      }
      th.appendChild(arrow)
    })
  }

  document.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort
      if (sortState.key === key) {
        sortState.ascending = !sortState.ascending
      } else {
        sortState.key = key
        sortState.ascending = true
      }
      renderRows()
      updateSortArrows()
    })
  })

  renderRows()
  updateSortArrows()

  // Function to set CSS variable value
  function calcImgMarginRightCSSVariable() {
    const imgContainer = document.getElementById('imgContainer')
    const rect = imgContainer.getBoundingClientRect()
    const excedent = 400 - (rect.right - rect.left)
    if (excedent > 0) {
      const marginRight = excedent / 3
      console.log(rect.right - rect.left, excedent, marginRight)
      document.documentElement.style.setProperty('--margin-right', `-${marginRight}px`);
    }
  }

  // Initial setup after document load
  document.addEventListener('DOMContentLoaded', function () {
    calcImgMarginRightCSSVariable();
  });

  // Update CSS variable value on window resize
  window.addEventListener('resize', function () {
    calcImgMarginRightCSSVariable();
  });
</script>

</html>
